name: Bug report
description: Report a problem so we can fix it
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill in as much detail as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include a minimal config or code snippet and the exact commands you ran.
      placeholder: |
        1. Config used '...'
        2. Command run '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      description: Paste the full error output or traceback. This will be rendered as code.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide relevant version information.
      value: |
        - OS:
        - Python version:
        - mcap-data-loader version:
        - LeRobot version (if relevant):
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
